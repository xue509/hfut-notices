<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="斛兵来信">
<meta name="theme-color" content="#AF2227">
<link rel="manifest" href="manifest.json">
<title>斛兵来信</title>
<style>
:root {
  /* 工大红 —— 取自 www.hfut.edu.cn 主色 #af2227 */
  --brand: #AF2227; --brand-dark: #8E1B1F; --brand-tint: #FDF2F2;
  --brand-gradient: linear-gradient(135deg, #8E1B1F 0%, #AF2227 45%, #C93A38 100%);
  --gold: #CDB560;

  --bg: #F5F6F8; --card: #FFFFFF; --text: #1A1C1E; --text2: #5F6368; --text3: #9AA0A6;
  --border: #E8EAED; --shadow-sm: 0 1px 2px rgba(0,0,0,.04); --shadow-md: 0 2px 12px rgba(0,0,0,.06); --shadow-lg: 0 8px 24px rgba(0,0,0,.08);
  --radius-sm: 12px; --radius: 18px; --radius-lg: 24px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;

  /* 底部导航的玻璃质感：底色要够透才看得见下面的内容，否则就是块白板。
     透到什么程度都能算，所以标签再加一圈同色描边（--tab-halo），
     不管底下飘过去什么颜色，字都不会糊。 */
  --glass-bg: rgba(255,255,255,.70);
  --glass-line: rgba(255,255,255,.55);
  --glass-hi: rgba(255,255,255,.75);
  --glass-sheen: rgba(255,255,255,.5);
  --glass-blob: rgba(175,34,39,.10);
  --tab-halo: rgba(255,255,255,.9);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1115; --card: #1B1E24; --text: #E8EAED; --text2: #9AA0A6; --text3: #5F6368;
    --border: #2D3138; --shadow-sm: 0 1px 2px rgba(0,0,0,.2); --shadow-md: 0 2px 12px rgba(0,0,0,.3); --shadow-lg: 0 8px 24px rgba(0,0,0,.4);
    --brand: #F87171; --brand-dark: #EF4444; --brand-tint: #2A1416;
    --brand-gradient: linear-gradient(135deg, #6B1418 0%, #8E1B1F 45%, #AF2227 100%);
    --glass-bg: rgba(20,23,28,.60);
    --glass-line: rgba(255,255,255,.07);
    --glass-hi: rgba(255,255,255,.10);
    --glass-sheen: rgba(255,255,255,.06);
    --glass-blob: rgba(248,113,113,.16);
    --tab-halo: rgba(0,0,0,.75);
  }
}

* { margin:0; padding:0; box-sizing:border-box }
html { scroll-behavior:smooth; -webkit-tap-highlight-color:transparent }
body { font-family:var(--font); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; overflow-x:hidden; min-height:100vh; padding-bottom:calc(72px + var(--safe-bottom)); transition:background .3s,color .3s }
a { color:var(--brand); text-decoration:none }

/* ===== Hero Header ===== */
.hero { position:relative; background:var(--brand-gradient); padding:16px 16px 32px; padding-top:calc(16px + env(safe-area-inset-top, 0px)); overflow:hidden }
.hero::before { content:''; position:absolute; top:-60px; right:-40px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle,rgba(205,181,96,.22) 0%,transparent 70%) }
.hero::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:24px; background:var(--bg); border-radius:24px 24px 0 0 }
.hero-top { display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1 }
.hero-brand { display:flex; align-items:center; gap:10px }
.hero-logo { width:44px; height:44px; background:rgba(255,255,255,.18); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.15) }
.hero-title { color:#fff; font-size:20px; font-weight:700; letter-spacing:.3px; line-height:1.2 }
.hero-sub { color:rgba(255,255,255,.68); font-size:12px; font-weight:400; margin-top:1px }
.hero-actions { display:flex; gap:6px; position:relative; z-index:1 }
.hero-btn { width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.15); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.12); color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s }
.hero-btn:active { transform:scale(.92); background:rgba(255,255,255,.25) }

/* ===== Glass Stats ===== */
.stats-row { display:flex; gap:10px; margin-top:16px; position:relative; z-index:2 }
.stat-item { flex:1; background:rgba(255,255,255,.12); backdrop-filter:blur(12px); border-radius:var(--radius-sm); padding:14px 10px; text-align:center; border:1px solid rgba(255,255,255,.1); transition:transform .15s; cursor:pointer }
.stat-item:active { transform:scale(.96) }
.stat-num { font-size:28px; font-weight:800; color:#fff; letter-spacing:-1px; line-height:1 }
.stat-num.gold { color:var(--gold) }
.stat-date { font-size:13px; color:#fff; font-weight:600; margin-top:2px }
.stat-label { font-size:10px; color:rgba(255,255,255,.62); margin-top:2px; font-weight:500 }

/* ===== Section header ===== */
.section { padding:0 16px; margin-top:20px }
.section-title { font-size:12px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px }

/* ===== Pill Tabs ===== */
.pills-wrap { overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:0 16px }
.pills-wrap::-webkit-scrollbar { display:none }
.pills { display:inline-flex; gap:8px; padding:4px 0 }
.pill { padding:7px 14px; border-radius:20px; font-size:13px; font-weight:500; border:none; cursor:pointer; background:var(--card); color:var(--text2); box-shadow:var(--shadow-sm); transition:background .2s cubic-bezier(.4,0,.2,1), color .2s cubic-bezier(.4,0,.2,1), box-shadow .2s cubic-bezier(.4,0,.2,1), transform .2s cubic-bezier(.4,0,.2,1); white-space:nowrap; display:inline-flex; align-items:center; gap:4px }
.pill:active { transform:scale(.94) }
.pill .pill-n { font-size:10px; opacity:.55; font-weight:700 }
/* 选中的药丸用该类别的主题色（由 JS 注入 --pill-c） */
.pill.on { background:var(--pill-c, var(--brand)); color:#fff; box-shadow:0 4px 12px rgba(175,34,39,.28); transform:scale(1.02) }
.pill.on .pill-n { opacity:.8 }

/* ===== Date Group ===== */
.date-header { display:flex; align-items:center; gap:8px; padding:16px 16px 8px }
.date-dot { width:8px; height:8px; border-radius:50%; background:var(--brand) }
.date-label { font-size:13px; font-weight:600; color:var(--text); letter-spacing:.2px }

/* ===== Cards ===== */
.feed { padding:0 16px }
/* 一屏只装得下 5 张卡，可整条 feed 有 8 万像素高 —— 530 张全量排版实测 39ms，
   而这正是切 tab 时把药丸动画堵住的那部分。content-visibility:auto 让屏幕外的卡
   不参与排版（实测 39ms → 2ms）。contain-intrinsic-size 是它的估高，不写会先按 0
   算、滚动条一路变长；里面的 auto 会记住实测高度，滚过一遍后就不再有估算误差。
   ⚠️ 113 是「内容高度」不是卡片高度：contain-intrinsic-size 量的是内容盒，把实测的
   卡片高度 146px 直接填进来，等于每张卡虚报 33px（内边距 32 + 上下边框 2），530 张
   下来整页高估 21%（实测 100519 vs 真实 83052）。 */
.card { background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:10px; box-shadow:var(--shadow-md); cursor:pointer; transition:transform .2s cubic-bezier(.4,0,.2,1), box-shadow .2s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden; border:1px solid var(--border); border-left:3px solid var(--cat-c, var(--brand));
  contain-intrinsic-size:113px; contain-intrinsic-size:auto 113px; content-visibility:auto }
.card:active { transform:scale(.975); box-shadow:var(--shadow-sm) }
.card-head { display:flex; align-items:flex-start; gap:10px }
.card-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; margin-top:1px; background:var(--cat-tint, var(--brand-tint)) }
.card-title { font-size:14px; font-weight:600; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--text) }
.card-meta { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap }
.card-date { font-size:11px; color:var(--text3); font-weight:500 }
.card-tag { display:inline-block; padding:3px 8px; border-radius:8px; font-size:10px; font-weight:600; letter-spacing:.3px; background:var(--cat-tint, var(--brand-tint)); color:var(--cat-c, var(--brand)) }
.card-source { font-size:10px; color:var(--text3) }
/* 展开箭头跟在标签行末尾，不做绝对定位 —— 悬在卡片中间会压住正文 */
.card-chevron { margin-left:auto; width:18px; height:18px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--text3); flex-shrink:0; transition:transform .25s, background .25s, color .25s }
.card.expanded .card-chevron { transform:rotate(90deg); background:var(--brand); color:#fff }
/* 简介常显（一行），展开后显示全文 */
.card-summary { font-size:12px; color:var(--text2); line-height:1.6; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.card.expanded .card-summary { display:block; -webkit-line-clamp:unset }
/* 展开动画：.card-detail 是个 0fr→1fr 的 grid，高度自己长出来（原来是 display 直接
   切 block，没有中间态，看着就是「啪」一下跳开）。padding 和 border 必须放在裁切层
   里面，留在容器上收起来时那 12px 还占着位置。 */
.card-detail { display:grid; grid-template-rows:0fr; opacity:0; visibility:hidden;
  transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1), opacity .26s, visibility 0s .32s }
.card.expanded .card-detail { grid-template-rows:1fr; opacity:1; visibility:visible;
  transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1), opacity .26s, visibility 0s }
.card-detail .cd-in { overflow:hidden; min-height:0 }
.card-detail .detail-row:first-child { margin-top:12px; padding-top:12px; border-top:1px solid var(--border) }
@keyframes detailOpen { from { grid-template-rows:0fr; opacity:0 } to { grid-template-rows:1fr; opacity:1 } }
/* 首页/搜索的卡平时不带 detail（530 份隐藏正文 = 39% 的 DOM，白解析），是按下去那下
   才建出来的。新建的元素没有「变化前」的样式，过渡不会触发，所以首次用动画补上。 */
.card-detail.cd-new { animation:detailOpen .32s cubic-bezier(.4,0,.2,1) }
.detail-row { margin-bottom:6px; font-size:12px; color:var(--text2); line-height:1.6 }
.detail-row .dl { color:var(--text3); margin-right:4px; font-size:11px }
/* justify-self:start —— .card-detail 现在是 grid，按钮不这么写会被拉成整行宽 */
.card-link { justify-self:start; display:inline-flex; align-items:center; gap:4px; margin-top:8px; padding:8px 16px; background:var(--brand); color:#fff; border-radius:20px; font-size:12px; font-weight:600; text-decoration:none; transition:all .15s }
.card-link:active { opacity:.8; transform:scale(.96) }

/* ===== Pull to refresh ===== */
.pull-bar { text-align:center; overflow:hidden; max-height:0; transition:max-height .3s }
.pull-bar.active { max-height:48px; padding:12px }
.pull-spin { display:inline-block; width:20px; height:20px; border:2px solid #ddd; border-top-color:var(--brand); border-radius:50%; animation:spin .7s linear infinite }
@keyframes spin { to { transform:rotate(360deg) } }

/* ===== Bottom Nav ===== */
/* ===== Bottom Tab Bar（液态玻璃） ===== */
.tab-bar { position:fixed; bottom:0; left:0; right:0; z-index:100; display:flex; padding:0 8px; padding-bottom:var(--safe-bottom);
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--glass-line);
  box-shadow:0 -6px 28px rgba(0,0,0,.10), inset 0 1px 0 var(--glass-hi); }
/* 顶部高光渐变 —— 玻璃的「反光边」，中间亮两边淡 */
.tab-bar::before { content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:linear-gradient(180deg, var(--glass-sheen) 0%, transparent 52%) }
/* 跟随选中项滑动的玻璃药丸 */
/* transition 里不带 width：6 个 tab 是 flex:1 等宽的，宽度每次写进去都一样、本来就
   不产生过渡，留着只会让旋转屏/改窗口时药丸自己慢慢拉 420ms。will-change 让位移走
   合成层 —— 切 tab 那一帧主线程在重建列表，药丸不靠它也能滑完。 */
.tab-blob { position:absolute; left:0; top:6px; z-index:0; height:calc(100% - 12px - var(--safe-bottom)); border-radius:16px;
  background:var(--glass-blob); box-shadow:inset 0 1px 0 var(--glass-hi), 0 1px 6px rgba(0,0,0,.05);
  will-change:transform;
  transition:transform .42s cubic-bezier(.34,1.28,.5,1), opacity .2s }
/* 未选中用 text2 而不是 text3 —— 10px 小字压在玻璃上，#9AA0A6 只有 2.7:1，
   逼到眼睛跟前才看得清；#5F6368 有 6.5:1。选中/未选中靠红色和药丸区分已经够了。 */
.tab-item { flex:1; display:flex; flex-direction:column; align-items:center; padding:8px 0 6px; border:none; background:none; cursor:pointer; color:var(--text2); transition:color .2s, transform .2s; position:relative; z-index:1 }
.tab-item .tb-icon { font-size:21px; transition:transform .25s cubic-bezier(.34,1.4,.5,1) }
.tab-item .tb-label { font-size:10px; font-weight:500; margin-top:2px; text-shadow:0 0 6px var(--tab-halo), 0 0 3px var(--tab-halo) }
.tab-item.active { color:var(--brand) }
.tab-item.active .tb-icon { transform:translateY(-1px) scale(1.08) }
/* 不支持 backdrop-filter 的老浏览器（含部分国产内核）退回不透明底 */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .tab-bar { background:var(--card) }
  .tab-blob { background:var(--bg) }
}

/* ===== Search Overlay ===== */
.search-overlay { display:none; position:fixed; inset:0; background:var(--bg); z-index:300; padding:16px; padding-top:calc(16px + env(safe-area-inset-top, 0px)); overflow-y:auto }
.search-overlay.show { display:block; animation:fadeIn .2s }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
.search-bar { display:flex; align-items:center; gap:8px; background:var(--card); border-radius:var(--radius); padding:8px 14px; box-shadow:var(--shadow-md); border:2px solid var(--brand); transition:all .2s }
.search-bar input { flex:1; border:none; background:transparent; font-size:15px; color:var(--text); outline:none; font-family:var(--font) }
.search-bar .cancel { background:none; border:none; font-size:14px; font-weight:600; color:var(--brand); cursor:pointer; white-space:nowrap; padding:6px 4px }
.search-empty { text-align:center; padding:48px 16px; color:var(--text3) }
.search-more { text-align:center; padding:14px 16px 4px; color:var(--text3); font-size:12px; line-height:1.6 }
.search-empty .se-icon { font-size:44px; margin-bottom:10px; display:block }

/* ===== Empty state ===== */
.empty { text-align:center; padding:48px 16px; color:var(--text3) }
.empty .em-icon { font-size:48px; margin-bottom:10px; display:block }
.empty .em-text { font-size:14px; font-weight:500 }

/* ===== About ===== */
.about-page { display:none; padding:20px 16px }
.about-page.show { display:block; animation:fadeIn .25s }
.about-card { background:var(--card); border-radius:var(--radius-lg); padding:28px 20px; text-align:center; box-shadow:var(--shadow-md); border:1px solid var(--border) }
.about-card .alogo { font-size:56px; margin-bottom:12px }
.about-card h2 { font-size:20px; font-weight:700; margin-bottom:4px }
.about-card .aver { font-size:12px; color:var(--text3); margin-bottom:18px }
.about-card p { font-size:13px; color:var(--text2); line-height:2 }
.about-groups { margin-top:14px; text-align:left }
.about-group { display:flex; align-items:baseline; gap:8px; padding:7px 10px; border-radius:10px; background:var(--bg); margin-bottom:5px }
.about-group .ag-name { font-size:12px; font-weight:600; color:var(--text); white-space:nowrap }
.about-group .ag-cats { font-size:11px; color:var(--text3); line-height:1.5 }
.about-cats { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:14px }
.about-cat { font-size:11px; padding:4px 10px; border-radius:12px; background:var(--bg); color:var(--text2) }
.dark-btn { display:inline-flex; align-items:center; gap:6px; padding:10px 20px; border-radius:24px; background:var(--bg); border:1px solid var(--border); color:var(--text); font-size:13px; font-weight:500; cursor:pointer; margin-top:14px; transition:all .15s }
.dark-btn:active { transform:scale(.95) }

/* ===== Toast ===== */
.toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#1F1F1F; color:#fff; padding:10px 20px; border-radius:24px; font-size:12px; font-weight:600; z-index:400; opacity:0; transition:opacity .3s; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.2) }
.toast.show { opacity:1 }

/* ===== iOS safe area patches ===== */
@supports(padding:max(0px)){
  .hero { padding-top:max(16px,env(safe-area-inset-top)) }
  body { padding-bottom:max(72px,calc(72px + env(safe-area-inset-bottom))) }
  .tab-bar { padding-bottom:max(0px,env(safe-area-inset-bottom)) }
}
</style>
</head>
<body>

<!-- Hero -->
<div class="hero">
  <div class="hero-top">
    <div class="hero-brand">
      <div class="hero-logo">📬</div>
      <div>
        <div class="hero-title">斛兵来信</div>
        <div class="hero-sub">合工大通知 · 实时更新</div>
      </div>
    </div>
    <div class="hero-actions">
      <button class="hero-btn" onclick="refreshData()" aria-label="刷新">🔄</button>
      <button class="hero-btn" onclick="toggleSearch()" aria-label="搜索">🔍</button>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat-item" onclick="switchTab('all','','')">
      <div class="stat-num" id="totalCount">-</div>
      <div class="stat-label">📬 全部通知</div>
    </div>
    <div class="stat-item" onclick="jumpToCat('competition')">
      <div class="stat-num gold" id="compCount">-</div>
      <div class="stat-label">🏆 竞赛</div>
    </div>
    <div class="stat-item" onclick="jumpToCat('holiday')">
      <div class="stat-num gold" id="holidayCount">-</div>
      <div class="stat-label">📅 节假日</div>
    </div>
  </div>
</div>

<!-- Pull to refresh -->
<div class="pull-bar" id="pullBar"><div class="pull-spin"></div></div>

<!-- Category pills -->
<div class="pills-wrap" id="pillsArea">
  <div class="pills" id="pillsInner"></div>
</div>

<!-- Feed -->
<div id="feedArea">
  <div class="feed" id="noticeList"></div>
</div>

<!-- About -->
<div class="about-page" id="aboutPage">
  <div class="about-card">
    <div class="alogo">📬</div>
    <h2>斛兵来信</h2>
    <div class="aver" id="aboutVer">v3.0 · 合工大通知监控</div>
    <p>
      🏫 监控 4 个官方来源<br>
      🏆 竞赛 · 节假日 推送微信<br>
      📱 PushPlus 实时通知<br>
      30 字简介 · 深色模式 · 八大分类
    </p>
    <div class="about-groups" id="aboutGroups"></div>
    <div class="about-cats" id="aboutCats"></div>
    <p style="margin-top:14px">
      <a href="https://news.hfut.edu.cn/tzgg2.htm" target="_blank">🔗 访问官网</a>
    </p>
    <button class="dark-btn" onclick="toggleDarkMode()">
      <span id="darkIcon">🌙</span> <span id="darkLabel">深色模式</span>
    </button>
  </div>
</div>

<!-- Bottom tab bar —— 大分类由 data.json 的 groups 渲染，见 renderNav() -->
<div class="tab-bar" id="tabBar"></div>

<!-- Search overlay -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-bar">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="搜索标题、简介、标签…" oninput="queueSearch()" autocomplete="off">
    <button class="cancel" onclick="toggleSearch()">取消</button>
  </div>
  <div class="feed" id="searchResults" style="margin-top:14px"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== State =====
// CATS / GROUPS 由 data.json 注入（后端 classifier.py 是唯一权威来源，前端不另写一份）
// 三级：currentTab 大分类(或 'all') → currentCat 细分类 → currentSub 板块标签
let allNotices = [], CATS = {}, GROUPS = [];
let currentTab = 'all', currentCat = '', currentSub = '', currentPage = 'home';
let darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;

// ===== 深色模式 =====
function applyDark() {
  const keys = {
    '--bg': darkMode ? '#0F1115' : '#F5F6F8',
    '--card': darkMode ? '#1B1E24' : '#FFFFFF',
    '--text': darkMode ? '#E8EAED' : '#1A1C1E',
    '--text2': darkMode ? '#9AA0A6' : '#5F6368',
    '--text3': darkMode ? '#5F6368' : '#9AA0A6',
    '--border': darkMode ? '#2D3138' : '#E8EAED',
    '--brand': darkMode ? '#F87171' : '#AF2227',
    '--brand-dark': darkMode ? '#EF4444' : '#8E1B1F',
    '--brand-tint': darkMode ? '#2A1416' : '#FDF2F2',
    '--glass-bg': darkMode ? 'rgba(20,23,28,.60)' : 'rgba(255,255,255,.70)',
    '--glass-line': darkMode ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.55)',
    '--glass-hi': darkMode ? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,.75)',
    '--glass-sheen': darkMode ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.5)',
    '--glass-blob': darkMode ? 'rgba(248,113,113,.16)' : 'rgba(175,34,39,.10)',
    '--tab-halo': darkMode ? 'rgba(0,0,0,.75)' : 'rgba(255,255,255,.9)',
  };
  Object.entries(keys).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
  document.getElementById('darkIcon').textContent = darkMode ? '☀️' : '🌙';
  document.getElementById('darkLabel').textContent = darkMode ? '浅色模式' : '深色模式';
}
function toggleDarkMode() { darkMode = !darkMode; applyDark(); haptic(); }
applyDark();

// ===== 类别取色（浅色/深色各一套，均已过 WCAG AA） =====
function catColor(key) {
  const c = CATS[key] || {};
  return (darkMode ? c.color_dk : c.color) || (darkMode ? '#F87171' : '#AF2227');
}
function catTint(key) {
  // 由类别色推导淡底：深色模式用低透明度叠加，浅色模式用高透明度
  return hexA(catColor(key), darkMode ? 0.16 : 0.10);
}
function hexA(hex, a) {
  const h = hex.replace('#','');
  const n = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

// ===== Data =====
async function loadData() {
  try {
    const r = await fetch('data.json?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    CATS = d.categories || {};
    GROUPS = d.groups || [];
    allNotices = (d.notices || []).slice();
    allNotices.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  } catch(e) {
    allNotices = sampleData();
    CATS = sampleCats();
    GROUPS = sampleGroups();
  }
  // 卡片上只记下标（data-i），展开时按它取正文 —— 排完序后下标才稳定
  allNotices.forEach((n, i) => { n._i = i; });
  renderNav();
  renderAbout();
  render(true);   // 数据换了，缓存里的筛选键一律作废
}

function sampleGroups() {
  return [
    {key:'study',   label:'学习', emoji:'📚', categories:['research','academic','competition']},
    {key:'life',    label:'生活', emoji:'🏠', categories:['support','holiday']},
    {key:'affair',  label:'学工', emoji:'🎯', categories:['student']},
    {key:'bulletin',label:'公告', emoji:'📢', categories:['notice']},
  ];
}

function sampleCats() {
  return {
    competition:{label:'竞赛通知',emoji:'🏆',color:'#C2410C',color_dk:'#FB923C'},
    holiday:{label:'节假日',emoji:'📅',color:'#15803D',color_dk:'#4ADE80'},
    student:{label:'学工通知',emoji:'🎯',color:'#6D28D9',color_dk:'#A78BFA'},
    other:{label:'其他',emoji:'📌',color:'#475569',color_dk:'#94A3B8'},
  };
}

function sampleData() {
  return [
    {title:"关于举办2026新域新质创新大赛校内选拔赛的通知",date:"2026-07-21",link:"#",category:"competition",sub_label:"学科竞赛",source_tab:"新闻网",summary:"各单位：为培养学生创新实践能力，现组织报名参加2026年新域新质创新大赛校内选拔赛，各学院于9月30日前提交材料。"},
    {title:"关于2026年清明节放假安排的通知",date:"2026-04-01",link:"#",category:"holiday",sub_label:"放假通知",source_tab:"新闻网",summary:"4月4日至6日放假调休，共3天。请各单位做好值班安排。"},
  ];
}

async function refreshData() {
  document.getElementById('pullBar').classList.add('active'); haptic('medium');
  await loadData();
  setTimeout(() => { document.getElementById('pullBar').classList.remove('active'); showToast('已刷新'); }, 600);
}

// ===== 渲染 =====
function groupOf(cat) { return GROUPS.find(g => (g.categories||[]).includes(cat)) || null; }

// 大分类下的条数
function groupCount(key) {
  const g = GROUPS.find(x => x.key === key);
  if (!g) return 0;
  return allNotices.filter(n => (g.categories||[]).includes(n.category)).length;
}

// 当前筛选范围。三个条件层层收窄，空串/null 表示不限。
function inScope(n) {
  if (currentTab !== 'all') {
    const g = GROUPS.find(x => x.key === currentTab);
    if (!g || !(g.categories||[]).includes(n.category)) return false;
  }
  if (currentCat && n.category !== currentCat) return false;
  if (currentSub && (n.sub_label||'') !== currentSub) return false;
  return true;
}

// 列表重建很贵（530 张卡：拼串 + 解析 + 排版），同一套筛选条件来回点（连点同一个
// tab、从关于页切回来、点统计卡回到原分类）不该付第二遍。数据变了走 force。
let _lastRenderKey = '';
function render(force) {
  const key = currentTab + '|' + currentCat + '|' + currentSub;
  if (!force && key === _lastRenderKey) return;
  _lastRenderKey = key;

  const filtered = allNotices.filter(inScope)
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));

  // 概览
  document.getElementById('totalCount').textContent = allNotices.length;
  document.getElementById('compCount').textContent = countOf('competition');
  document.getElementById('holidayCount').textContent = countOf('holiday');

  renderPills();

  const groups = dateGroups(filtered);
  let html = '';
  if (filtered.length === 0) {
    // 「全部」空 = 真没抓到；收窄过的范围空 = 这类本来就没有，别混为一谈
    const narrowed = currentTab !== 'all' || currentCat || currentSub;
    let what = '暂时没抓到通知';
    if (narrowed) {
      const label = (CATS[currentCat] || {}).label ||
                    (GROUPS.find(g => g.key === currentTab) || {}).label || '该类';
      what = '暂时没有' + label;
    }
    html = '<div class="empty"><span class="em-icon">📭</span>' +
           '<div class="em-text">' + esc(what) + '</div></div>';
  } else {
    for (const [label, items] of Object.entries(groups)) {
      html += '<div class="date-header"><div class="date-dot"></div><div class="date-label">' +
              label + ' (' + items.length + ')</div></div>';
      for (const n of items) html += cardHtml(n);
    }
  }
  document.getElementById('noticeList').innerHTML = html;
}

function countOf(key) { return allNotices.filter(n => n.category === key).length; }

// 从首页统计卡直接跳到某个细分类（所属大分类现查，不写死）
function jumpToCat(cat) {
  const g = groupOf(cat);
  if (g) switchTab(g.key, cat, ''); else switchTab('all', '', '');
}

// 卡片上只放 30 字短简介；展开后才给全文。
// data-i 是它在 allNotices 里的下标 —— 展开时才去取正文（详见 toggleCard）。
function cardHtml(n) {
  const cat = n.category || 'other';
  const meta = CATS[cat] || {};
  const sub = n.sub_label || '';
  const brief = n.summary_short || '';
  // 短简介为空说明正文只是复述标题，这时留白比挂一句废话干净。
  return '<div class="card" data-i="' + (n._i == null ? '' : n._i) + '" ' +
           'style="--cat-c:' + catColor(cat) + ';--cat-tint:' + catTint(cat) + '" ' +
           'onclick="toggleCard(this)">' +
    '<div class="card-head">' +
      '<div class="card-icon">' + (meta.emoji || '📌') + '</div>' +
      '<div class="card-title">' + esc(n.title) + '</div>' +
    '</div>' +
    '<div class="card-meta">' +
      '<span class="card-date">📆 ' + esc(n.date || '') + '</span>' +
      (sub ? '<span class="card-tag">' + esc(sub) + '</span>' : '') +
      '<span class="card-source">' + esc(n.source_tab||'') + '</span>' +
      '<span class="card-chevron">▶</span>' +
    '</div>' +
    (brief ? '<div class="card-summary">' + esc(brief) + '</div>' : '') +
  '</div>';
}

// 展开的那一块。列表里 530 张卡全都预先带上它的话，等于白解析 39% 的 DOM
// （而且它们 display 一直是收着的，省下的排版为 0），所以按需生成。
function detailHtml(n) {
  const cat = n.category || 'other';
  const meta = CATS[cat] || {};
  const sub = n.sub_label || '';
  const summary = n.summary || '';
  return '<div class="cd-in">' +
      '<div class="detail-row"><span class="dl">🏷️</span>' +
        (meta.label || '其他') + (sub ? ' · ' + esc(sub) : '') + '</div>' +
      (summary ? '<div class="detail-row"><span class="dl">📄</span>' + esc(summary) + '</div>'
               : '<div class="detail-row" style="color:var(--text3)"><span class="dl">📄</span>暂无简介</div>') +
      '<a href="' + esc(n.link||'#') + '" target="_blank" rel="noopener" class="card-link" ' +
         'onclick="event.stopPropagation()">查看官网原文 →</a>' +
    '</div>';
}

function pillHtml(on, color, onclick, inner) {
  return '<button class="pill' + (on ? ' on' : '') + '" style="--pill-c:' + color + '" ' +
         'onclick="' + onclick + '">' + inner + '</button>';
}

// 组里有内容的细分类
function groupCatKeys() {
  const g = GROUPS.find(x => x.key === currentTab);
  return ((g || {}).categories || []).filter(k => countOf(k) > 0);
}

function subKeys(cat) {
  return [...new Set(allNotices.filter(n => n.category === cat)
                             .map(n => n.sub_label).filter(Boolean))];
}

// 药丸条什么时候值得出现:
//   全部页 —— 大分类已经在底栏上了，再列一遍是重复
//   组里只有一个有内容的细分类 —— 「全部」就等于它，没什么可筛的
function pillsVisible() {
  if (currentPage !== 'home' || currentTab === 'all') return false;
  if (groupCatKeys().length > 1) return true;
  return currentCat ? subKeys(currentCat).length > 1 : false;
}

function renderPills() {
  const inner = document.getElementById('pillsInner');
  if (!pillsVisible()) { inner.innerHTML = ''; return; }

  const g = GROUPS.find(x => x.key === currentTab) || {categories: []};
  const cats = groupCatKeys();
  const tab = currentTab;

  let html = pillHtml(!currentCat && !currentSub, 'var(--brand)',
    "switchTab('" + tab + "','','')",
    (g.emoji||'') + ' 全部 <span class="pill-n">' + groupCount(tab) + '</span>');

  for (const k of cats) {
    const meta = CATS[k];
    html += pillHtml(currentCat === k && !currentSub, catColor(k),
      "switchTab('" + tab + "','" + k + "','')",
      (meta.emoji||'') + ' ' + esc(meta.label||k) +
      ' <span class="pill-n">' + countOf(k) + '</span>');
  }

  // 板块标签（新闻网/学工/教务…），选中细分类且确实有多个板块时才出现
  if (currentCat) {
    const subs = subKeys(currentCat);
    if (subs.length > 1) {
      const c = catColor(currentCat);
      html += pillHtml(!currentSub, c,
        "switchTab('" + tab + "','" + currentCat + "','')", '全部');
      for (const s of subs) {
        html += pillHtml(currentSub === s, c,
          "switchTab('" + tab + "','" + currentCat + "','" + esc(s) + "')", esc(s));
      }
    }
  }
  inner.innerHTML = html;
}

function renderAbout() {
  const el = document.getElementById('aboutCats');
  if (!el) return;
  el.innerHTML = Object.entries(CATS).map(([k,v]) =>
    '<span class="about-cat">' + (v.emoji||'') + ' ' + esc(v.label||k) + '</span>'
  ).join('');

  // 大分类 → 它包含的细分类，让人一眼看懂分组
  const gEl = document.getElementById('aboutGroups');
  if (!gEl) return;
  gEl.innerHTML = GROUPS.map(g => {
    const names = (g.categories||[]).map(k => (CATS[k]||{}).label || k);
    return '<div class="about-group"><span class="ag-name">' +
           (g.emoji||'') + ' ' + esc(g.label||g.key) + '</span>' +
           '<span class="ag-cats">' + esc(names.join(' · ')) + '</span></div>';
  }).join('');
}

function dateGroups(notices) {
  const now = new Date();
  const today = now.toISOString().slice(0,10);
  const yesterday = new Date(now - 864e5).toISOString().slice(0,10);
  const weekAgo = new Date(now - 7*864e5).toISOString().slice(0,10);
  const monthAgo = new Date(now - 30*864e5).toISOString().slice(0,10);
  const groups = {};
  for (const n of notices) {
    const d = n.date || '';
    let k;
    if (d === today) k = '今天';
    else if (d === yesterday) k = '昨天';
    else if (d > weekAgo) k = '本周';
    else if (d > monthAgo) k = '本月';
    else k = '更早';
    if (!groups[k]) groups[k] = [];
    groups[k].push(n);
  }
  return groups;
}

// ===== Bottom Nav（液态玻璃） =====
// tab 栏是固定的 6 等分，几何量一次就够（renderNav / resize 时才作废）。
// 以前每次 moveBlob 都现读 offsetWidth/offsetLeft —— 那是在刚重建完 530 张卡的
// 脏文档上读，一次强制同步布局实测 20-25ms，而且读的是整数、药丸比 tab 窄 0.33px。
let _navGeo = null;
function navGeo() {
  if (_navGeo) return _navGeo;
  const bar = document.getElementById('tabBar');
  const base = bar.getBoundingClientRect().left;
  _navGeo = [...bar.querySelectorAll('.tab-item')].map(b => {
    const r = b.getBoundingClientRect();
    return { key: b.dataset.key, x: r.left - base, w: r.width };
  });
  return _navGeo;
}

function renderNav() {
  _navGeo = null;   // 底栏要重建了，缓存的矩形作废
  const bar = document.getElementById('tabBar');
  const btn = (key, emoji, label) =>
    '<button class="tab-item" data-key="' + key + '" ' +
    'onclick="' + (key === 'about' ? "showPage('about')" : "switchTab('" + key + "','','')") + '">' +
    '<span class="tb-icon">' + emoji + '</span>' +
    '<span class="tb-label">' + esc(label) + '</span></button>';

  let html = '<span class="tab-blob" id="tabBlob"></span>' + btn('all', '📬', '全部');
  for (const g of GROUPS) html += btn(g.key, g.emoji || '📌', g.label || g.key);
  html += btn('about', '⚙', '关于');
  bar.innerHTML = html;
  syncNav();
}

// 高亮当前项，并把玻璃药丸滑过去
function syncNav() {
  const bar = document.getElementById('tabBar');
  const activeKey = currentPage !== 'home' ? 'about' : currentTab;
  bar.querySelectorAll('.tab-item').forEach(b =>
    b.classList.toggle('active', b.dataset.key === activeKey));
  moveBlob();
}

function moveBlob() {
  const bar = document.getElementById('tabBar');
  const blob = document.getElementById('tabBlob');
  if (!bar || !blob) return;
  const act = bar.querySelector('.tab-item.active');
  const g = act && navGeo().find(r => r.key === act.dataset.key);
  if (!g || !g.w) { blob.style.opacity = '0'; return; }
  // 首帧不要从最左边滑过来，直接落位：这一次先关掉过渡、落好位、把样式刷出来，
  // 再把过渡放开。比原来「加 .init 类 + 等两帧再摘」稳 —— 那两帧里点 tab 会瞬移。
  if (!blob.dataset.placed) {
    blob.dataset.placed = '1';
    blob.style.transition = 'none';
    blob.style.width = g.w + 'px';
    blob.style.transform = 'translateX(' + g.x + 'px)';
    blob.style.opacity = '1';
    void blob.offsetWidth;
    blob.style.transition = '';
    return;
  }
  blob.style.opacity = '1';
  blob.style.width = g.w + 'px';
  blob.style.transform = 'translateX(' + g.x + 'px)';
}

// ===== Tab & Page =====
// tab: 'all' 或大分类 key；cat: 细分类 key；sub: 板块标签
function switchTab(tab, cat, sub) {
  currentTab = tab || 'all';
  currentCat = cat || '';
  currentSub = sub || '';
  // 先认下「在首页」再 render —— 药丸渲染要看 currentPage 决定显不显示
  currentPage = 'home';
  // 顺序：药丸在底栏，跟列表无关，先让它动。以前是 render() → showPage() → 药丸，
  // 等于让「重建 530 张卡」排在药丸前面，看着就是「按下去没反应，然后突然跳一下」。
  // 注意光「先写 transform」是不够的 —— 写了不产生帧，过渡要等主线程腾出来才上屏。
  // 真正把用户看到的第一帧拉起来的是「列表让帧」和「content-visibility」两件事，
  // 缺一个都不行（6x 降速、点「全部」、录屏实测「点下去→第一帧新画面」）：
  //   都不做 537ms ｜ 只让帧 45.8ms ｜ 只 content-visibility 145ms ｜ 两个都做 25.9ms
  showPage('home');
  scheduleRender();
  haptic();
}

// 列表重建让出两帧，别堵住药丸的起步。
// 一帧不够：点击任务结束后紧跟着的那一帧里，rAF 回调排在样式计算之前，重的那次
// render()（50-60ms）会把这一帧整个吃掉 —— 实测让一帧 145ms 才见到新画面，让两帧 25.9ms。
// 之后主线程虽然仍在重建列表（实测 rAF 间隔被拉到 128ms），但药丸走的是合成层：
// 用户看到的第一帧是 25.9ms，整段过渡仍然按时在 439ms 停稳，是四组配置里最快的一组。
// 所以别看主线程帧间隔 —— 那段动画根本不靠它。
let _renderQueued = false;
function scheduleRender() {
  if (_renderQueued) return;
  _renderQueued = true;
  requestAnimationFrame(() => requestAnimationFrame(() => { _renderQueued = false; render(); }));
}

function toggleCard(card) {
  if (!card.querySelector('.card-detail')) {
    const n = allNotices[Number(card.dataset.i)];
    if (n) card.insertAdjacentHTML('beforeend',
      '<div class="card-detail cd-new">' + detailHtml(n) + '</div>');
  }
  card.classList.toggle('expanded');
  haptic();
}

function showPage(page) {
  currentPage = page;
  const home = page === 'home';
  document.getElementById('pillsArea').style.display = pillsVisible() ? '' : 'none';
  document.getElementById('feedArea').style.display = home ? '' : 'none';
  document.getElementById('aboutPage').classList.toggle('show', page === 'about');
  syncNav();
}

// 旋转屏 / 改窗口：底栏宽度变了，缓存的矩形和药丸位置一起更新
window.addEventListener('resize', () => { _navGeo = null; moveBlob(); });

// ===== Search =====
function toggleSearch() {
  const ov = document.getElementById('searchOverlay');
  const show = ov.classList.toggle('show');
  if (show) {
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '';
    setTimeout(() => document.getElementById('searchInput').focus(), 150);
  }
}

// 每敲一个字都跑一遍 530 条 × 6 字段的匹配 + 把命中项全渲染出来（「通」能命中
// 503/530），手机上等于每个字符吃掉 3-8 帧，连输入框自己的光标都掉帧。缓一下手。
let _searchTimer = 0;
function queueSearch() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(doSearch, 140);
}

function doSearch() {
  clearTimeout(_searchTimer);
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const el = document.getElementById('searchResults');
  if (!q) { el.innerHTML = ''; return; }
  const matched = allNotices.filter(n =>
    (n.title||'').toLowerCase().includes(q) ||
    (n.sub_label||'').toLowerCase().includes(q) ||
    (n.source_tab||'').toLowerCase().includes(q) ||
    (n.summary||'').toLowerCase().includes(q) ||
    (n.summary_short||'').toLowerCase().includes(q) ||
    ((CATS[n.category]||{}).label||'').includes(q)
  );
  if (!matched.length) {
    el.innerHTML = '<div class="search-empty"><span class="se-icon">🔍</span>未找到“' + esc(q) + '”</div>';
    return;
  }
  // 命中太多时只画前 120 条 —— 常见字动辄 400-500 条，全画出来既慢又没意义
  const MAX = 120;
  el.innerHTML = matched.slice(0, MAX).map(cardHtml).join('') +
    (matched.length > MAX
      ? '<div class="search-more">只显示前 ' + MAX + ' 条，共 ' + matched.length +
        ' 条 —— 再打几个字缩小范围</div>'
      : '');
}

// ===== Utils =====
function esc(s) { const d = document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }
function haptic(s) { try { navigator.vibrate(s==='medium'?15:6); } catch(e) {} }
function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

// ===== PWA =====
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }

// ===== Launch =====
loadData(); showPage('home');
</script>
</body>
</html>
